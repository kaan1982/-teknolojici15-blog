<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
.cv{--bg:#1A0B2E;--acc:#FF4FD8}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#120726 0%,#2B0F4C 45%,#5A1660 62%,#1A0B2E 62.2%)}
.sun{position:absolute;left:290px;top:800px;width:500px;height:500px;border-radius:50%;background:linear-gradient(#FFD23F,#FF6A3D 55%,#FF2E88);-webkit-mask:linear-gradient(#000 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 69%,#000 69% 77%,transparent 77% 83%,#000 83%);opacity:.9}
.floor{position:absolute;left:-200px;right:-200px;top:1192px;height:760px;background:linear-gradient(rgb(255 79 216/.7) 3px,transparent 3px) 0 0/100% 70px,linear-gradient(90deg,rgb(255 79 216/.7) 3px,transparent 3px) 0 0/90px 100%;transform:perspective(500px) rotateX(58deg);transform-origin:top}
.k{position:absolute;left:0;right:0;top:210px;text-align:center;color:#7FF6FF;text-shadow:0 0 18px #7FF6FF}
.t{position:absolute;left:30px;right:30px;top:285px;text-align:center;font-size:108px;color:#fff;white-space:nowrap;text-shadow:0 0 30px rgb(255 79 216/.6)}
.t em{font-style:normal;display:block;font-size:250px;line-height:.95;margin:10px 0 6px;color:transparent;background:linear-gradient(#FFE16B,#FF8A3D);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 0 #B8235C)}
.art{position:absolute;left:140px;width:800px;top:930px;height:680px}
.st{color:#7FF6FF;left:520px;top:1590px;font-size:58px;white-space:nowrap;transform:rotate(-6deg);text-shadow:0 0 16px #7FF6FF;box-shadow:0 0 22px #7FF6FF,inset 0 0 22px #7FF6FF;background:rgb(26 11 46/.8)}
.cv__foot{text-align:center;color:#fff}.cv__foot span{background:#120726;padding:14px 28px;border-radius:10px;border:3px solid #FF4FD8}
</style></head><body><div class="cv scan">
<div class="sky"></div><div class="sun"></div><div style="position:absolute;inset:0;overflow:hidden;z-index:0;isolation:isolate"><div class="floor"></div></div>
<div class="cv__top"><div class="cv__brand"><img src="../../../public/img/brand/mark.png">TEKNOLOJİCİ<b>15</b></div><div class="cv__tag">TEKNOLOJİ TARİHİ</div></div>
<div class="cv__kicker k">1964 · İLK BİLGİSAYAR FARESİ</div>
<div class="cv__title t">İLK FARE<em>TAHTA</em>BİR KUTUYDU!</div>

  <!-- cable tail -->
  <path d="M400 150 C400 60 520 40 600 70 S760 60 790 0" fill="none" stroke="#111" stroke-width="18" stroke-linecap="round"/>
  <path d="M400 150 C400 60 520 40 600 70 S760 60 790 0" fill="none" stroke="#7FF6FF" stroke-width="5" stroke-linecap="round"/>
  <!-- wooden box: top face -->
  <path d="M160 260 L400 150 L660 250 L420 380Z" fill="#D49A5A" stroke="#2A1608" stroke-width="7" stroke-linejoin="round"/>
  <!-- front faces -->
  <path d="M160 260 L420 380 L420 560 L160 430Z" fill="#A86B34" stroke="#2A1608" stroke-width="7" stroke-linejoin="round"/>
  <path d="M420 380 L660 250 L660 420 L420 560Z" fill="#8A5428" stroke="#2A1608" stroke-width="7" stroke-linejoin="round"/>

  <g fill="none" stroke="#9C6532" stroke-width="4" stroke-linecap="round">
    <path d="M230 250 C320 230 420 260 520 220"/><path d="M260 290 C350 270 450 300 560 260"/><path d="M300 330 C380 315 470 330 590 285"/>
    <path d="M180 320 C260 360 330 380 400 420" stroke="#8B5A2B"/><path d="M180 380 C260 410 330 440 400 480" stroke="#8B5A2B"/>
  </g>
  <!-- red button -->
  <path d="M480 220 L560 190 L600 210 L520 242Z" fill="#E8333C" stroke="#2A1608" stroke-width="6" stroke-linejoin="round"/>
  <!-- wheels -->
  <ellipse cx="290" cy="520" rx="55" ry="22" fill="#CFD6DE" stroke="#2A1608" stroke-width="6"/>
  <ellipse cx="560" cy="510" rx="22" ry="50" fill="#CFD6DE" stroke="#2A1608" stroke-width="6"/>
  <!-- labels -->
  <g font-family="V,monospace" font-size="40" fill="#7FF6FF">
    <text x="120" y="610">X TEKERİ</text><text x="600" y="610">Y TEKERİ</text>
  </g>
  <text x="680" y="140" font-family="V,monospace" font-size="40" fill="#FFD23F">"KUYRUK"</text>
</svg>
<div class="cv__stamp st">ŞAKA DEĞİL!</div>
<div class="cv__foot"><span>Mucidi tek kuruş telif almadı 🖱️</span></div>
</div></body></html>
