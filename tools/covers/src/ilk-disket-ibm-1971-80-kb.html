<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
.cv{--bg:#2C6E8F;--ink:#fff;--acc:#FFD23F}
.px{position:absolute;inset:0;background:linear-gradient(rgb(255 255 255/.07) 2px,transparent 2px) 0 0/40px 40px,linear-gradient(90deg,rgb(255 255 255/.07) 2px,transparent 2px) 0 0/40px 40px}
.topbar{position:absolute;left:0;right:0;top:0;height:170px;background:#14324A}
.k{position:absolute;left:0;right:0;top:206px;text-align:center}
.k span{background:#14324A;color:var(--acc);padding:6px 26px;box-shadow:8px 8px 0 #0B1E2D}
.art{position:absolute;left:120px;top:330px;width:840px;height:840px;shape-rendering:crispEdges}
.t{position:absolute;left:40px;right:40px;top:1290px;font-size:150px;text-align:center;text-shadow:10px 10px 0 #14324A}
.t em{font-style:normal;color:var(--acc);display:block;font-size:230px;margin-top:10px}
.st{color:#fff;background:#E8333C;border-color:#fff;left:420px;top:1105px;font-size:54px;white-space:nowrap;transform:rotate(-7deg);box-shadow:10px 10px 0 #0B1E2D;border-radius:0}
.cv__foot{text-align:center}
.cv__foot span{background:#14324A;padding:16px 36px;font-size:38px;box-shadow:8px 8px 0 #0B1E2D}
</style></head><body><div class="cv">
<div class="px"></div><div class="topbar"></div>
<div class="cv__top"><div class="cv__brand"><img src="../../../public/img/brand/mark.png">TEKNOLOJİCİ<b>15</b></div><div class="cv__tag">Teknoloji tarihi</div></div>
