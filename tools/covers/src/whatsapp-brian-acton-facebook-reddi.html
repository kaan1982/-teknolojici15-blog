<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
.cv{--bg:#08061A;--ink:#F4F0FF;--acc:#39FF88}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 80% 30%,rgb(57 255 136/.16),transparent 45%),radial-gradient(circle at 15% 60%,rgb(255 51 102/.16),transparent 45%)}
.k{position:absolute;left:0;right:0;top:196px;text-align:center;color:#FF5C8A;text-shadow:0 0 16px rgb(255 51 102/.6)}
.art{position:absolute;left:50px;top:280px;width:980px;height:820px}
.t{position:absolute;left:30px;right:30px;top:1230px;font-size:136px;text-align:center}
.t em{font-style:normal;color:#FF3366;display:block;text-shadow:0 0 30px rgb(255 51 102/.6)}
.st{color:var(--acc);background:#08061A;left:540px;top:1060px;font-size:62px;white-space:nowrap;transform:rotate(-8deg);box-shadow:0 0 30px rgb(57 255 136/.45)}
.cv__foot{text-align:center}
</style></head><body><div class="cv scan">
<div class="bg"></div>
<div class="cv__top"><div class="cv__brand"><img src="../../../public/img/brand/mark.png">TEKNOLOJİCİ<b>15</b></div><div class="cv__tag">Teknoloji tarihi</div></div>
<div class="cv__kicker k">AĞUSTOS 2009 → ŞUBAT 2014</div>
<svg class="art" viewBox="0 0 980 820">
  <!-- rejection letter -->
  <g transform="rotate(-6 260 380)">
    <rect x="40" y="90" width="440" height="560" rx="14" fill="#F4F0FF"/>
    <rect x="40" y="90" width="440" height="80" rx="14" fill="#D9D3EE"/>
    <text x="70" y="145" font-family="V" font-size="42" fill="#2A2440">İŞ BAŞVURUSU · 2009</text>
    <g fill="#B9B2D3"><rect x="70" y="210" width="340" height="16" rx="8"/><rect x="70" y="250" width="380" height="16" rx="8"/><rect x="70" y="290" width="300" height="16" rx="8"/><rect x="70" y="330" width="360" height="16" rx="8"/><rect x="70" y="370" width="220" height="16" rx="8"/></g>
    <g transform="rotate(-14 260 500)">
      <rect x="110" y="440" width="300" height="110" rx="10" fill="none" stroke="#FF3366" stroke-width="10"/>
      <text x="260" y="518" text-anchor="middle" font-family="A" font-weight="900" font-size="66" fill="#FF3366">RET</text>
    </g>
  </g>
  <!-- arrow -->
  <path d="M500 380 C 560 330, 600 330, 640 360" fill="none" stroke="#F4F0FF" stroke-width="8" stroke-dasharray="18 14"/>
  <path d="M630 335 L655 372 L612 380" fill="none" stroke="#F4F0FF" stroke-width="8" stroke-linejoin="round"/>
  <!-- money tag -->
  <g transform="rotate(5 800 400)">
    <rect x="640" y="200" width="320" height="400" rx="28" fill="#0F2A1C" stroke="#39FF88" stroke-width="8"/>
    <text x="800" y="300" text-anchor="middle" font-family="V" font-size="52" fill="#39FF88">2014</text>
    <text x="800" y="430" text-anchor="middle" font-family="A" font-weight="900" font-size="150" fill="#39FF88">19</text>
    <text x="800" y="500" text-anchor="middle" font-family="A" font-weight="900" font-stretch="115%" font-size="54" fill="#F4F0FF">MİLYAR $</text>
    <text x="800" y="560" text-anchor="middle" font-family="V" font-size="36" fill="#9FE8BF">ANLAŞMA</text>
  </g>
</svg>
<div class="cv__stamp st">NASIL YANİ?</div>
<div class="cv__title t">FACEBOOK ONU <em>İŞE ALMADI</em></div>
<div class="cv__foot">5 yıl sonra ortağı olduğu şirketi aldı 💸</div>
</div></body></html>
